name: Agentic Post-Publish Validation

on:
  workflow_run:
    workflows:
      - Agentic RC Worker
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-post-publish-validation
  cancel-in-progress: false

jobs:
  dispatch-validation:
    name: Dispatch exact-head validation after Worker publish
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard RC target
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" != "main"
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;;
            *) echo "::error::Refusing unapproved RC target."; exit 1 ;;
          esac

      - name: Checkout RC target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch Validation only for a fresh Worker checkpoint
        shell: bash
        run: |
          set -euo pipefail
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          committed_at="$(git log -1 --format='%cI')"
          head_sha="$(git rev-parse HEAD)"

          if [ "$author" != "walkie-agentic-worker[bot]" ]; then
            echo "No dispatch: latest RC head is not Worker-authored." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$subject" in
            "chore(agentic): continue RC execution"|"chore(agentic): checkpoint RC execution") ;;
            *) echo "No dispatch: latest RC head is not an Agentic checkpoint." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac

          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100" --jq "[.workflow_runs[] | select(.name == \"Agentic RC Validation\" and .created_at >= \"$committed_at\")] | length")"
          if [ "$existing" -gt 0 ]; then
            echo "No dispatch: Validation already exists after current Worker head." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run agentic-rc-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH" \
            -f expected_sha="$head_sha"
          echo "Dispatched exact-head Validation for $head_sha." >> "$GITHUB_STEP_SUMMARY"
