name: Web Staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - rc/web-staging-integration

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-staging-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Staging
    runs-on: [self-hosted, Windows, X64]
    environment: staging
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
    steps:
      - name: Guard staging branch
        shell: powershell
        run: |
          if ('${{ github.ref_name }}' -ne 'rc/web-staging-integration') { throw 'Web Staging may only deploy from rc/web-staging-integration.' }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --runInBand

      - name: Export Expo Web
        run: npx expo export --platform web --output-dir dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Web Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
