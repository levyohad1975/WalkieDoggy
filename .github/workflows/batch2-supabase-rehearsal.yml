name: Batch 2 Supabase Rehearsal

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/verifiedAdminOnboarding.ts"
      - "src/screens/FamilyOnboardingScreen.tsx"
      - ".github/workflows/batch2-supabase-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase-rehearsal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify known duplicate 0019 state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'supabase/migrations/0019_request_result_read_state.sql')) { throw 'missing 0019_request_result_read_state.sql' }
          if (-not (Test-Path 'supabase/migrations/0019_request_result_seen_state.sql')) { throw 'missing 0019_request_result_seen_state.sql' }
          if ((Get-Item 'supabase/migrations/0019_request_result_read_state.sql').Length -ne 0) { throw 'read_state duplicate must remain empty' }
          if ((Get-Item 'supabase/migrations/0019_request_result_seen_state.sql').Length -eq 0) { throw 'seen_state migration must be non-empty' }

      - name: Prepare ephemeral migration history
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rehearsalDir = Join-Path $env:RUNNER_TEMP ('batch2-rehearsal-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $rehearsalDir | Out-Null
          Copy-Item 'supabase/migrations/0032_verified_family_onboarding.sql' $rehearsalDir
          Copy-Item 'supabase/migrations/0033_verified_family_onboarding_cutover.sql' $rehearsalDir
          Copy-Item 'supabase/migrations/0034_email_delivery_log.sql' $rehearsalDir
          Get-ChildItem 'supabase/migrations' -Filter '*.sql' | Remove-Item -Force
          Copy-Item 'supabase/schema.sql' 'supabase/migrations/0000_base_schema.sql'
          Copy-Item (Join-Path $rehearsalDir '0032_verified_family_onboarding.sql') 'supabase/migrations/'
          Copy-Item (Join-Path $rehearsalDir '0033_verified_family_onboarding_cutover.sql') 'supabase/migrations/'
          Copy-Item (Join-Path $rehearsalDir '0034_email_delivery_log.sql') 'supabase/migrations/'

      - name: Install Supabase CLI for Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.116.0'
          $toolsDir = Join-Path $env:RUNNER_TEMP 'supabase-cli'
          $zip = Join-Path $env:RUNNER_TEMP "supabase_${version}_windows_amd64.zip"
          if (Test-Path $toolsDir) { Remove-Item $toolsDir -Recurse -Force }
          New-Item -ItemType Directory -Path $toolsDir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/supabase/cli/releases/download/v$version/supabase_${version}_windows_amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $toolsDir -Force
          $exe = Get-ChildItem $toolsDir -Recurse -Filter 'supabase.exe' | Select-Object -First 1
          if (-not $exe) { throw 'supabase.exe not found after extracting Windows CLI archive' }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Supabase CLI version check failed' }

      - name: Configure and verify Docker for Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerBin = 'C:\Program Files\Docker\Docker\resources\bin'
          $dockerExe = Join-Path $dockerBin 'docker.exe'
          if (-not (Test-Path $dockerExe)) { throw "docker.exe not found at $dockerExe" }
          $dockerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$dockerBin;$env:PATH"
          & $dockerExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Docker CLI version check failed' }
          & $dockerExe info
          if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is not accessible from the GitHub runner service account' }

      - name: Start isolated Supabase stack
        shell: powershell
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor

      - name: Reapply all migrations from a clean database
        shell: powershell
        run: supabase db reset --local

      - name: Verify Batch 2 schema and authorization cutover
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sql = @'
          select 1 / ((select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'families' and column_name in ('approval_status', 'created_by_auth_user_id')) = 2)::int;
          select 1 / (to_regprocedure('public.create_verified_family(uuid,text,text,boolean)') is not null)::int;
          select 1 / (to_regprocedure('public.system_admin_set_family_approval(uuid,text)') is not null)::int;
          select 1 / (not has_function_privilege('anon', 'public.create_family(text,text)', 'EXECUTE'))::int;
          select 1 / (not has_function_privilege('authenticated', 'public.create_family(text,text)', 'EXECUTE'))::int;
          select 1 / (has_function_privilege('service_role', 'public.create_verified_family(uuid,text,text,boolean)', 'EXECUTE'))::int;
          select 1 / (position('approval_status' in pg_get_functiondef('public.current_family_id()'::regprocedure)) > 0)::int;
          select 1 / ((select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'email_delivery_log') = 1)::int;
          select 1 / ((select relrowsecurity from pg_class where oid = 'public.email_delivery_log'::regclass) is true)::int;
          select 1 / ((select count(*) from pg_policies where schemaname = 'public' and tablename = 'email_delivery_log') = 0)::int;
          select 1 / (to_regprocedure('public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)') is not null)::int;
          select 1 / (to_regprocedure('public.update_email_delivery_status(text,text,text,text)') is not null)::int;
          select 1 / (has_function_privilege('service_role', 'public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)', 'EXECUTE'))::int;
          select 1 / (not has_function_privilege('authenticated', 'public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)', 'EXECUTE'))::int;
          select 1 / (not has_function_privilege('anon', 'public.update_email_delivery_status(text,text,text,text)', 'EXECUTE'))::int;
          select 1 / (has_function_privilege('authenticated', 'public.system_admin_list_email_delivery_log(integer)', 'EXECUTE'))::int;
          '@
          $sql | docker exec -i supabase_db_WalkieDoggy psql -U postgres -d postgres -v ON_ERROR_STOP=1
          if ($LASTEXITCODE -ne 0) { throw "Batch 2 schema verification failed with exit code $LASTEXITCODE" }

      - name: Stop isolated stack
        if: always()
        shell: powershell
        run: |
          if (Get-Command supabase -ErrorAction SilentlyContinue) {
            supabase stop --no-backup
          } else {
            Write-Host 'Supabase CLI unavailable; nothing to stop.'
          }
