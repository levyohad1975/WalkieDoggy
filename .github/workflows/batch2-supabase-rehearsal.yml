name: Batch 2 Supabase Rehearsal

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/verifiedAdminOnboarding.ts"
      - "src/screens/FamilyOnboardingScreen.tsx"
      - ".github/workflows/batch2-supabase-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_STAGING_PROJECT_REF: czbxhsoxyawprqehkfit

jobs:
  staging-safe-rehearsal:
    name: Staging-safe Batch 2 rehearsal
    runs-on: [self-hosted, Windows, X64]
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify migration artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'supabase/migrations/0019_request_result_read_state.sql')) { throw 'missing 0019_request_result_read_state.sql' }
          if (-not (Test-Path 'supabase/migrations/0019_request_result_seen_state.sql')) { throw 'missing 0019_request_result_seen_state.sql' }
          if ((Get-Item 'supabase/migrations/0019_request_result_read_state.sql').Length -ne 0) { throw 'read_state duplicate must remain empty' }
          if ((Get-Item 'supabase/migrations/0019_request_result_seen_state.sql').Length -eq 0) { throw 'seen_state migration must be non-empty' }
          foreach ($migration in @('0032_verified_family_onboarding.sql','0033_verified_family_onboarding_cutover.sql','0034_email_delivery_log.sql')) {
            if (-not (Test-Path (Join-Path 'supabase/migrations' $migration))) { throw "missing $migration" }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Verify approved Staging target and credentials
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('SUPABASE_STAGING_URL','SUPABASE_STAGING_ANON_KEY','STAGING_OTP_TEST_EMAIL','STAGING_OTP_GMAIL_CLIENT_ID','STAGING_OTP_GMAIL_CLIENT_SECRET','STAGING_OTP_GMAIL_REFRESH_TOKEN')
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing required staging secret(s): $($missing -join ', ')" }
          $uri = [Uri]$env:SUPABASE_STAGING_URL
          $projectRef = $uri.Host.Split('.')[0]
          if ($projectRef -ne $env:EXPECTED_STAGING_PROJECT_REF) { throw 'Refusing rehearsal outside approved Staging project.' }
          Write-Host 'Verified approved Staging project target.'

      - name: Verify Staging connectivity
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const url = process.env.SUPABASE_STAGING_URL;
          const res = await fetch(`${url}/auth/v1/health`, { signal: AbortSignal.timeout(15000) });
          console.log(`Staging health endpoint reached: HTTP ${res.status}`);
          if (res.status >= 500) process.exit(1);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Approved Staging endpoint is not reachable.' }

      - name: Run verified family creation E2E against Staging
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          node scripts/staging-family-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Staging Family E2E exited with code $LASTEXITCODE." }

      - name: Write evidence summary
        if: always()
        shell: powershell
        run: |
          @"
          ## Batch 2 Staging-safe rehearsal

          - Environment: ``staging``
          - Approved project ref: ``$env:EXPECTED_STAGING_PROJECT_REF``
          - Local Docker/Supabase dependency: none
          - Flow: real Staging OTP → verified session → family persistence → invite lookup → second-device join
          - Production credentials/actions: none
          - Result: ``${{ job.status }}``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
