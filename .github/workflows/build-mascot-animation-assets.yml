name: Build Mascot Animation Assets
on:
  push:
    branches: [fix/urgent-master-batch-20260925]
    paths:
      - scripts/build_mascot_animation_assets.py
      - .github/workflows/build-mascot-animation-assets.yml
      - '!assets/mascot-animations/**'
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/urgent-master-batch-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check opencv-python-headless numpy
      - run: python scripts/build_mascot_animation_assets.py
      - name: Commit generated transparent sprite sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mascot-animations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add transparent mascot animation assets"
          git push origin HEAD:fix/urgent-master-batch-20260925
