name: Agentic RC Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-rc-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: Deterministic RC controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard RC target
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;;
            *) echo "::error::Refusing to watch an unapproved target branch."; exit 1 ;;
          esac
          test "$TARGET_BRANCH" != "main"

      - name: Checkout RC target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decide deterministic next action
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch_validation=false" >> "$GITHUB_OUTPUT"
          echo "dispatch_worker=false" >> "$GITHUB_OUTPUT"

          head_sha="$(git rev-parse HEAD)"
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          committed_at="$(git log -1 --format='%cI')"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100")"
          active_count="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select((.name == "Agentic RC Worker" or .name == "Agentic RC Validation") and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "ACTIVE: an Agentic Worker/Validation is already running; no duplicate dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A published Agentic checkpoint must be validated for this exact head
          # before another worker is allowed to write. Do not use an old successful
          # validation to hide a later worker failure on the same head.
          if [ "$author" = "walkie-agentic-worker[bot]" ]; then
            case "$subject" in
              "chore(agentic): continue RC execution"|"chore(agentic): checkpoint RC execution")
                validation_json="$(printf '%s' "$runs_json" | jq --arg committed "$committed_at" '[.workflow_runs[] | select(.name == "Agentic RC Validation" and .created_at >= $committed)] | sort_by(.created_at) | reverse')"
                latest_validation_time="$(printf '%s' "$validation_json" | jq -r '.[0].created_at // ""')"
                latest_validation_conclusion="$(printf '%s' "$validation_json" | jq -r '.[0].conclusion // "none"')"

                if [ -z "$latest_validation_time" ] || [ "$latest_validation_conclusion" != "success" ]; then
                  echo "dispatch_validation=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: exact RC head $head_sha needs successful Validation." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi

                # Once this exact head has passed Validation, inspect only Workers
                # started AFTER that success. This ordering is the bug #43 missed.
                post_validation_workers="$(printf '%s' "$runs_json" | jq --arg validated "$latest_validation_time" '[.workflow_runs[] | select(.name == "Agentic RC Worker" and .created_at > $validated)] | sort_by(.created_at) | reverse')"
                post_count="$(printf '%s' "$post_validation_workers" | jq 'length')"
                latest_post_conclusion="$(printf '%s' "$post_validation_workers" | jq -r '.[0].conclusion // "none"')"

                if [ "$post_count" -eq 0 ]; then
                  echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: head $head_sha is validated and has no later Worker; continuing RC." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi

                if [ "$latest_post_conclusion" = "success" ]; then
                  # A successful Worker with unchanged HEAD means no publishable
                  # progress. One bounded retry is allowed; after two unchanged
                  # attempts, surface a real stall instead of green idle.
                  if [ "$post_count" -lt 2 ]; then
                    echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                    echo "DISPATCHED: successful Worker produced no newer head; one bounded continuation retry." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  echo "::error::STALLED: two Worker attempts completed after Validation without publishing a newer RC head."
                  exit 1
                fi

                if [ "$latest_post_conclusion" = "failure" ]; then
                  if [ "$post_count" -lt 2 ]; then
                    echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                    echo "DISPATCHED: latest Worker failed; one bounded recovery attempt for unchanged head $head_sha." >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  echo "::error::STALLED: repeated Worker failure on unchanged RC head $head_sha after bounded recovery."
                  exit 1
                fi

                echo "::error::STALLED: latest post-Validation Worker has unsupported conclusion '$latest_post_conclusion'."
                exit 1
                ;;
            esac
          fi

          # Non-Agentic RC heads still represent ready RC work. If no execution is
          # active, dispatch one Worker. A watchdog may never finish green and idle
          # merely because a previous infrastructure-era Worker already ran.
          echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
          echo "DISPATCHED: RC work exists at non-Agentic head $head_sha and no execution is active." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-head Validation
        if: steps.gate.outputs.dispatch_validation == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run agentic-rc-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH" \
            -f expected_sha="$HEAD_SHA"
          echo "Validation dispatched for exact RC head $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch bounded Worker
        if: steps.gate.outputs.dispatch_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agentic-rc-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH"
          echo "Worker dispatched for $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"
