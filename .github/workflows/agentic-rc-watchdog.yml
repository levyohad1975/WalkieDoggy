name: Agentic RC Watchdog

on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agentic-rc-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-rc-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: Deterministic RC controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard RC target
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;;
            *) echo "::error::Refusing to watch an unapproved target branch."; exit 1 ;;
          esac
          test "$TARGET_BRANCH" != "main"

      - name: Checkout RC target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Decide deterministic next action
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch_validation=false" >> "$GITHUB_OUTPUT"
          echo "dispatch_worker=false" >> "$GITHUB_OUTPUT"
          echo "dispatch_family_e2e=false" >> "$GITHUB_OUTPUT"

          head_sha="$(git rev-parse HEAD)"
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          committed_at="$(git log -1 --format='%cI')"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100")"
          active_count="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select((.name == "Agentic RC Worker" or .name == "Agentic RC Validation" or .name == "Staging Family E2E") and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          if [ "$active_count" -gt 0 ]; then
            echo "ACTIVE: Worker, Validation, or Family E2E is already running; no duplicate dispatch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A successful Staging Readiness run is durable environment evidence. Once it
          # exists, the next safe gate is the real Family E2E, not another retry of an
          # older Worker failure on the same RC head.
          readiness_json="$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.name == "Agentic Staging Readiness")] | sort_by(.created_at) | reverse')"
          latest_readiness_time="$(printf '%s' "$readiness_json" | jq -r '.[0].created_at // ""')"
          latest_readiness_conclusion="$(printf '%s' "$readiness_json" | jq -r '.[0].conclusion // "none"')"
          family_success_time=""

          if [ -n "$latest_readiness_time" ] && [ "$latest_readiness_conclusion" = "success" ]; then
            family_json="$(printf '%s' "$runs_json" | jq --arg ready "$latest_readiness_time" '[.workflow_runs[] | select(.name == "Staging Family E2E" and .created_at > $ready)] | sort_by(.created_at) | reverse')"
            family_count="$(printf '%s' "$family_json" | jq 'length')"
            if [ "$family_count" -eq 0 ]; then
              echo "dispatch_family_e2e=true" >> "$GITHUB_OUTPUT"
              echo "DISPATCHED: Staging Readiness succeeded; advancing to real Staging Family E2E." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            latest_family_conclusion="$(printf '%s' "$family_json" | jq -r '.[0].conclusion // "none"')"
            latest_family_time="$(printf '%s' "$family_json" | jq -r '.[0].created_at // ""')"
            if [ "$latest_family_conclusion" = "failure" ]; then
              echo "::error::STAGING_FAMILY_E2E_BLOCKED: latest Family E2E failed after verified Staging Readiness."
              exit 1
            fi
            if [ "$latest_family_conclusion" = "success" ]; then
              family_success_time="$latest_family_time"
              workers_after_family="$(printf '%s' "$runs_json" | jq --arg family "$family_success_time" '[.workflow_runs[] | select(.name == "Agentic RC Worker" and .created_at > $family)] | length')"
              if [ "$workers_after_family" -eq 0 ]; then
                echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                echo "DISPATCHED: Family E2E succeeded; continuing RC execution." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi

          if [ "$author" = "walkie-agentic-worker[bot]" ]; then
            case "$subject" in
              "chore(agentic): continue RC execution"|"chore(agentic): checkpoint RC execution")
                validation_json="$(printf '%s' "$runs_json" | jq --arg committed "$committed_at" '[.workflow_runs[] | select(.name == "Agentic RC Validation" and .created_at >= $committed)] | sort_by(.created_at) | reverse')"
                latest_validation_time="$(printf '%s' "$validation_json" | jq -r '.[0].created_at // ""')"
                latest_validation_conclusion="$(printf '%s' "$validation_json" | jq -r '.[0].conclusion // "none"')"

                if [ -z "$latest_validation_time" ] || [ "$latest_validation_conclusion" != "success" ]; then
                  echo "dispatch_validation=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: exact RC head $head_sha needs successful Validation." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi

                worker_generation_time="$(gh api "repos/$GITHUB_REPOSITORY/commits?path=.github/workflows/agentic-rc-worker.yml&sha=main&per_page=1" --jq '.[0].commit.committer.date // empty')"
                recovery_epoch="$latest_validation_time"
                if [ -n "$worker_generation_time" ] && [[ "$worker_generation_time" > "$recovery_epoch" ]]; then
                  recovery_epoch="$worker_generation_time"
                fi
                if [ -n "$family_success_time" ] && [[ "$family_success_time" > "$recovery_epoch" ]]; then
                  recovery_epoch="$family_success_time"
                  echo "RESET: Family E2E success supersedes older Worker recovery attempts." >> "$GITHUB_STEP_SUMMARY"
                fi

                post_validation_workers="$(printf '%s' "$runs_json" | jq --arg epoch "$recovery_epoch" '[.workflow_runs[] | select(.name == "Agentic RC Worker" and .created_at > $epoch)] | sort_by(.created_at) | reverse')"
                post_count="$(printf '%s' "$post_validation_workers" | jq 'length')"
                latest_post_conclusion="$(printf '%s' "$post_validation_workers" | jq -r '.[0].conclusion // "none"')"

                if [ "$post_count" -eq 0 ]; then
                  echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: validated RC head has no Worker in the current recovery epoch." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                if [ "$latest_post_conclusion" = "success" ] && [ "$post_count" -lt 2 ]; then
                  echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: one bounded continuation retry." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                if [ "$latest_post_conclusion" = "failure" ] && [ "$post_count" -lt 2 ]; then
                  echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
                  echo "DISPATCHED: one bounded recovery attempt." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "::error::STALLED: bounded Worker recovery exhausted for current recovery epoch."
                exit 1
                ;;
            esac
          fi

          echo "dispatch_worker=true" >> "$GITHUB_OUTPUT"
          echo "DISPATCHED: RC work exists at non-Agentic head $head_sha and no execution is active." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Staging Family E2E
        if: steps.gate.outputs.dispatch_family_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run staging-family-e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH"
          echo "Staging Family E2E dispatched for $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact-head Validation
        if: steps.gate.outputs.dispatch_validation == 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run agentic-rc-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH" \
            -f expected_sha="$HEAD_SHA"
          echo "Validation dispatched for exact RC head $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch bounded Worker
        if: steps.gate.outputs.dispatch_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agentic-rc-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH"
          echo "Worker dispatched for $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"
