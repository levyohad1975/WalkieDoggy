name: Agentic RC Watchdog

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-rc-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: RC anti-stall fallback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard RC target
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" != "main"
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;;
            *) echo "::error::Refusing unapproved RC target."; exit 1 ;;
          esac

      - name: Checkout RC target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recover only an unvalidated worker head
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          author="$(git log -1 --format='%an')"
          subject="$(git log -1 --format='%s')"
          committed_at="$(git log -1 --format='%cI')"

          if [ "$author" != "walkie-agentic-worker[bot]" ]; then
            echo "No recovery: RC head is not Worker-authored." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$subject" in
            "chore(agentic): continue RC execution"|"chore(agentic): checkpoint RC execution") ;;
            *) echo "No recovery: RC head is not an Agentic checkpoint." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100")"
          active="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select((.name == "Agentic RC Validation" or .name == "Agentic RC Worker") and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          if [ "$active" -gt 0 ]; then
            echo "No recovery: trusted RC execution is active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          validations="$(printf '%s' "$runs" | jq --arg committed "$committed_at" '[.workflow_runs[] | select(.name == "Agentic RC Validation" and .created_at >= $committed)] | length')"
          if [ "$validations" -gt 0 ]; then
            echo "No recovery: Validation already exists after current Worker head." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run agentic-rc-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_branch="$TARGET_BRANCH" \
            -f expected_sha="$head_sha"
          echo "Recovered stalled RC by dispatching exact-head Validation for $head_sha." >> "$GITHUB_STEP_SUMMARY"
