name: Agentic RC Watchdog

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-rc-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: RC anti-stall fallback
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Guard RC target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TARGET_BRANCH)) { throw 'Missing RC target.' }
          if ($env:TARGET_BRANCH -eq 'main') { throw 'Refusing main as RC target.' }
          if ($env:TARGET_BRANCH -notmatch '^(feat|fix|chore|test|docs|rc)/[A-Za-z0-9._/-]+$') { throw 'Refusing invalid or unapproved RC target.' }
          if ($env:TARGET_BRANCH.Contains('..') -or $env:TARGET_BRANCH.EndsWith('/') -or $env:TARGET_BRANCH.Contains('//')) { throw 'Invalid RC branch.' }

      - name: Resolve RC head through GitHub API
        id: rc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedBranch = [System.Uri]::EscapeDataString($env:TARGET_BRANCH)
          $branchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/$encodedBranch"
          $branch = Invoke-RestMethod -Uri $branchUrl -Headers $headers -Method Get
          $headSha = [string]$branch.commit.sha
          if ($headSha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact RC head.' }
          "head_sha=$headSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Recover only an unvalidated worker head
        shell: powershell
        env:
          HEAD_SHA: ${{ steps.rc.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $commitUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:HEAD_SHA"
          $commit = Invoke-RestMethod -Uri $commitUrl -Headers $headers -Method Get
          $author = [string]$commit.commit.author.name
          $subject = ([string]$commit.commit.message -split "`n")[0].Trim()
          $committedAt = [DateTimeOffset]::Parse([string]$commit.commit.committer.date)

          if ($author -ne 'walkie-agentic-worker[bot]') {
            'No recovery: RC head is not Worker-authored.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($subject -notin @('chore(agentic): continue RC execution', 'chore(agentic): checkpoint RC execution')) {
            'No recovery: RC head is not an Agentic checkpoint.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $runsUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100"
          $runs = Invoke-RestMethod -Uri $runsUrl -Headers $headers -Method Get
          $active = @($runs.workflow_runs | Where-Object {
            $_.name -in @('Agentic RC Validation', 'Agentic RC Worker') -and
            $_.status -in @('queued', 'in_progress', 'waiting', 'requested', 'pending')
          }).Count
          if ($active -gt 0) {
            'No recovery: trusted RC execution is active.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $mainBranchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/main"
          $mainBranch = Invoke-RestMethod -Uri $mainBranchUrl -Headers $headers -Method Get
          $mainSha = [string]$mainBranch.commit.sha
          $validations = @($runs.workflow_runs | Where-Object {
            $_.name -eq 'Agentic RC Validation' -and
            [DateTimeOffset]::Parse($_.created_at) -ge $committedAt
          } | Sort-Object { [DateTimeOffset]::Parse($_.created_at) } -Descending)

          if ($validations.Count -gt 0) {
            $latestValidation = $validations[0]
            if ($latestValidation.conclusion -eq 'success') {
              'No recovery: current Worker head already has successful Validation.' | Add-Content $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            if ([string]$latestValidation.head_sha -eq $mainSha) {
              "No recovery: latest Validation already used current workflow revision $mainSha and concluded $($latestValidation.conclusion)." | Add-Content $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            "Retrying Validation because the latest failed Validation used older workflow revision $($latestValidation.head_sha), while main is $mainSha." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          $dispatchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/agentic-rc-validation.yml/dispatches"
          $body = @{
            ref = 'main'
            inputs = @{
              target_branch = $env:TARGET_BRANCH
              expected_sha = $env:HEAD_SHA
            }
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri $dispatchUrl -Headers $headers -Method Post -ContentType 'application/json' -Body $body
          "Recovered stalled RC by dispatching exact-head Validation for $env:HEAD_SHA." | Add-Content $env:GITHUB_STEP_SUMMARY
