name: Agentic RC Validation

on:
  workflow_run:
    workflows:
      - Agentic RC Worker
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_branch:
        description: "RC feature branch to validate"
        required: false
        type: string
      expected_sha:
        description: "Optional RC head SHA expected by the dispatcher"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agentic-rc-validation-${{ inputs.target_branch || vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: ${{ inputs.target_branch || vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
  EXPECTED_SHA: ${{ inputs.expected_sha || '' }}

jobs:
  guard:
    name: Guard fresh Agentic RC progress
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
      target_branch: ${{ steps.guard.outputs.target_branch }}
      head_sha: ${{ steps.fresh.outputs.head_sha }}
    steps:
      - name: Guard RC target
        id: guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TARGET_BRANCH)) { throw 'Missing RC target.' }
          if ($env:TARGET_BRANCH -eq 'main') { throw 'Agentic RC validation must never target main.' }
          if ($env:TARGET_BRANCH -notmatch '^(feat|fix|chore|test|docs|rc)/[A-Za-z0-9._/-]+$') { throw 'Refusing invalid or unapproved RC target.' }
          if ($env:TARGET_BRANCH.Contains('..') -or $env:TARGET_BRANCH.EndsWith('/') -or $env:TARGET_BRANCH.Contains('//')) { throw 'Invalid RC branch.' }
          "target_branch=$env:TARGET_BRANCH" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify fresh Agentic RC commit through GitHub API
        id: fresh
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          'fresh=false' | Add-Content $env:GITHUB_OUTPUT
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedBranch = [System.Uri]::EscapeDataString($env:TARGET_BRANCH)
          $branchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/$encodedBranch"
          $branch = Invoke-RestMethod -Uri $branchUrl -Headers $headers -Method Get
          $headSha = [string]$branch.commit.sha
          if ($headSha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact RC head.' }
          "head_sha=$headSha" | Add-Content $env:GITHUB_OUTPUT

          $commitUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$headSha"
          $commit = Invoke-RestMethod -Uri $commitUrl -Headers $headers -Method Get
          $author = [string]$commit.commit.author.name
          $subject = ([string]$commit.commit.message -split "`n")[0].Trim()
          $committedAt = [DateTimeOffset]::Parse([string]$commit.commit.committer.date)

          if ($author -ne 'walkie-agentic-worker[bot]') {
            'Latest RC commit was not published by the Agentic worker; no continuation is required.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($subject -notin @('chore(agentic): continue RC execution', 'chore(agentic): checkpoint RC execution')) {
            'Latest RC commit is not an Agentic continuation/checkpoint commit.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_SHA)) {
            if ($headSha -ne $env:EXPECTED_SHA) { throw "RC head $headSha does not match expected dispatcher SHA $env:EXPECTED_SHA." }
            'fresh=true' | Add-Content $env:GITHUB_OUTPUT
            "Fresh Agentic RC commit confirmed by explicit dispatch for $env:TARGET_BRANCH at $headSha." | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            'fresh=true' | Add-Content $env:GITHUB_OUTPUT
            "Fresh Agentic RC commit accepted from guarded manual/watchdog dispatch at $headSha." | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $startedAtRaw = if (-not [string]::IsNullOrWhiteSpace($env:RUN_STARTED_AT)) { $env:RUN_STARTED_AT } else { $env:RUN_CREATED_AT }
          if ([string]::IsNullOrWhiteSpace($startedAtRaw)) { throw 'Upstream worker start time is unavailable; refusing to infer freshness.' }
          $startedAt = [DateTimeOffset]::Parse($startedAtRaw)
          if ($committedAt -lt $startedAt) {
            'The RC head predates this worker run; no new progress was published.' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          'fresh=true' | Add-Content $env:GITHUB_OUTPUT
          "Fresh Agentic RC commit detected on $env:TARGET_BRANCH." | Add-Content $env:GITHUB_STEP_SUMMARY

  typecheck:
    name: TypeScript gate
    needs: guard
    if: needs.guard.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Jest gate
    needs: guard
    if: needs.guard.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand

  supabase-rehearsal:
    name: Isolated Supabase gate
    needs: guard
    if: needs.guard.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify known duplicate 0019 state
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/0019_request_result_read_state.sql
          test -f supabase/migrations/0019_request_result_seen_state.sql
          test ! -s supabase/migrations/0019_request_result_read_state.sql
          test -s supabase/migrations/0019_request_result_seen_state.sql
      - name: Prepare ephemeral Batch 2 migration history
        shell: bash
        run: |
          set -euo pipefail
          rehearsal_dir="$(mktemp -d)"
          cp supabase/migrations/0032_verified_family_onboarding.sql "$rehearsal_dir/"
          cp supabase/migrations/0033_verified_family_onboarding_cutover.sql "$rehearsal_dir/"
          cp supabase/migrations/0034_email_delivery_log.sql "$rehearsal_dir/"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -delete
          cp supabase/schema.sql supabase/migrations/0000_base_schema.sql
          cp "$rehearsal_dir/"0032_verified_family_onboarding.sql supabase/migrations/
          cp "$rehearsal_dir/"0033_verified_family_onboarding_cutover.sql supabase/migrations/
          cp "$rehearsal_dir/"0034_email_delivery_log.sql supabase/migrations/
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor
      - name: Reapply Batch 2 migrations from a clean database
        run: supabase db reset --local
      - name: Verify Batch 2 schema and authorization cutover
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          select 1 / ((select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'families' and column_name in ('approval_status', 'created_by_auth_user_id')) = 2)::int;
          select 1 / (to_regprocedure('public.create_verified_family(uuid,text,text,boolean)') is not null)::int;
          select 1 / (to_regprocedure('public.system_admin_set_family_approval(uuid,text)') is not null)::int;
          select 1 / (not has_function_privilege('anon', 'public.create_family(text,text)', 'EXECUTE'))::int;
          select 1 / (not has_function_privilege('authenticated', 'public.create_family(text,text)', 'EXECUTE'))::int;
          select 1 / (has_function_privilege('service_role','public.create_verified_family(uuid,text,text,boolean)','EXECUTE'))::int;
          select 1 / (position('approval_status' in pg_get_functiondef('public.current_family_id()'::regprocedure)) > 0)::int;
          select 1 / ((select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'email_delivery_log') = 1)::int;
          select 1 / ((select relrowsecurity from pg_class where oid = 'public.email_delivery_log'::regclass) is true)::int;
          select 1 / ((select count(*) from pg_policies where schemaname = 'public' and tablename = 'email_delivery_log') = 0)::int;
          select 1 / (to_regprocedure('public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)') is not null)::int;
          select 1 / (to_regprocedure('public.update_email_delivery_status(text,text,text,text)') is not null)::int;
          select 1 / (has_function_privilege('service_role','public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)','EXECUTE'))::int;
          select 1 / (not has_function_privilege('authenticated','public.record_email_delivery_attempt(uuid,uuid,text,text,text,text,text,text)','EXECUTE'))::int;
          select 1 / (not has_function_privilege('anon','public.update_email_delivery_status(text,text,text,text)','EXECUTE'))::int;
          select 1 / (has_function_privilege('authenticated','public.system_admin_list_email_delivery_log(integer)','EXECUTE'))::int;
          SQL
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup

  staging-family-e2e:
    name: Dispatch live Staging family E2E
    needs: guard
    if: needs.guard.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch independent Staging lane
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ needs.guard.outputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run staging-family-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_branch="$TARGET_BRANCH"
          echo "Dispatched live Staging Family E2E in parallel for $TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"

  continue:
    name: Dispatch next bounded Agentic unit
    needs:
      - guard
      - typecheck
      - tests
      - supabase-rehearsal
    if: >-
      always() &&
      needs.guard.outputs.fresh == 'true' &&
      needs.typecheck.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.supabase-rehearsal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Agentic RC Worker
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ needs.guard.outputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run agentic-rc-worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f target_branch="$TARGET_BRANCH"
          echo "Parallel local gates passed; dispatched next bounded Agentic RC unit for $TARGET_BRANCH without waiting for the independent live Staging lane." >> "$GITHUB_STEP_SUMMARY"
