name: Agentic RC Validation

on:
  workflow_run:
    workflows:
      - Agentic RC Worker
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_branch:
        description: "RC feature branch to validate"
        required: false
        type: string
      expected_sha:
        description: "Optional RC head SHA expected by the dispatcher"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agentic-rc-validation-${{ inputs.target_branch || vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: ${{ inputs.target_branch || vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}
  EXPECTED_SHA: ${{ inputs.expected_sha || '' }}

jobs:
  guard:
    name: Guard fresh Agentic RC progress
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
      target_branch: ${{ steps.guard.outputs.target_branch }}
      head_sha: ${{ steps.fresh.outputs.head_sha }}
    steps:
      - name: Guard RC target
        id: guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TARGET_BRANCH)) { throw 'Missing RC target.' }
          if ($env:TARGET_BRANCH -eq 'main') { throw 'Agentic RC validation must never target main.' }
          if ($env:TARGET_BRANCH -notmatch '^(feat|fix|chore|test|docs|rc)/[A-Za-z0-9._/-]+$') { throw 'Refusing invalid or unapproved RC target.' }
          if ($env:TARGET_BRANCH.Contains('..') -or $env:TARGET_BRANCH.EndsWith('/') -or $env:TARGET_BRANCH.Contains('//')) { throw 'Invalid RC branch.' }
          "target_branch=$env:TARGET_BRANCH" | Add-Content $env:GITHUB_OUTPUT

      - name: Verify fresh Agentic RC commit through GitHub API
        id: fresh
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          'fresh=false' | Add-Content $env:GITHUB_OUTPUT
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedBranch = [System.Uri]::EscapeDataString($env:TARGET_BRANCH)
          $branch = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/branches/$encodedBranch" -Headers $headers -Method Get
          $headSha = [string]$branch.commit.sha
          if ($headSha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact RC head.' }
          "head_sha=$headSha" | Add-Content $env:GITHUB_OUTPUT
          $commit = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$headSha" -Headers $headers -Method Get
          $author = [string]$commit.commit.author.name
          $subject = ([string]$commit.commit.message -split "`n")[0].Trim()
          $committedAt = [DateTimeOffset]::Parse([string]$commit.commit.committer.date)
          if ($author -ne 'walkie-agentic-worker[bot]') { 'Latest RC commit was not published by the Agentic worker; no continuation is required.' | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          if ($subject -notin @('chore(agentic): continue RC execution', 'chore(agentic): checkpoint RC execution')) { 'Latest RC commit is not an Agentic continuation/checkpoint commit.' | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_SHA)) {
            if ($headSha -ne $env:EXPECTED_SHA) { throw "RC head $headSha does not match expected dispatcher SHA $env:EXPECTED_SHA." }
            'fresh=true' | Add-Content $env:GITHUB_OUTPUT
            "Fresh Agentic RC commit confirmed by explicit dispatch for $env:TARGET_BRANCH at $headSha." | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { 'fresh=true' | Add-Content $env:GITHUB_OUTPUT; "Fresh Agentic RC commit accepted from guarded manual/watchdog dispatch at $headSha." | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          $startedAtRaw = if (-not [string]::IsNullOrWhiteSpace($env:RUN_STARTED_AT)) { $env:RUN_STARTED_AT } else { $env:RUN_CREATED_AT }
          if ([string]::IsNullOrWhiteSpace($startedAtRaw)) { throw 'Upstream worker start time is unavailable; refusing to infer freshness.' }
          if ($committedAt -lt [DateTimeOffset]::Parse($startedAtRaw)) { 'The RC head predates this worker run; no new progress was published.' | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          'fresh=true' | Add-Content $env:GITHUB_OUTPUT
          "Fresh Agentic RC commit detected on $env:TARGET_BRANCH." | Add-Content $env:GITHUB_STEP_SUMMARY

  local-gates:
    name: Local validation gates
    needs: guard
    if: needs.guard.outputs.fresh == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    outputs:
      passed: ${{ steps.gates.outputs.passed }}
    steps:
      - name: Bootstrap Node 22 for isolated validation
        id: node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'walkie-node-v22.22.0-win-x64'
          $nodeExe = Join-Path $nodeRoot 'node.exe'
          $npmCmd = Join-Path $nodeRoot 'npm.cmd'
          if (-not (Test-Path $nodeExe) -or -not (Test-Path $npmCmd)) {
            if (Test-Path $nodeRoot) { Remove-Item -Recurse -Force $nodeRoot }
            $zip = Join-Path $env:RUNNER_TEMP 'walkie-node-v22.22.0-win-x64.zip'
            Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.22.0/node-v22.22.0-win-x64.zip' -OutFile $zip
            $extract = Join-Path $env:RUNNER_TEMP 'walkie-node-extract'
            if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
            Expand-Archive -Path $zip -DestinationPath $extract
            Move-Item (Join-Path $extract 'node-v22.22.0-win-x64') $nodeRoot
            Remove-Item -Recurse -Force $extract
            Remove-Item -Force $zip
          }
          if (-not (Test-Path $nodeExe) -or -not (Test-Path $npmCmd)) { throw 'Node bootstrap did not produce node.exe and npm.cmd.' }
          "node_root=$nodeRoot" | Add-Content $env:GITHUB_OUTPUT
          "Node bootstrap ready: $(& $nodeExe --version); npm $(& $npmCmd --version)." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Run TypeScript and Jest on exact RC head
        id: gates
        shell: powershell
        env:
          HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          NODE_ROOT: ${{ steps.node.outputs.node_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          'passed=false' | Add-Content $env:GITHUB_OUTPUT
          $npm = Join-Path $env:NODE_ROOT 'npm.cmd'
          if (-not (Test-Path $npm)) { throw 'Bootstrapped npm.cmd is unavailable.' }
          $env:PATH = "$env:NODE_ROOT;$env:PATH"
          $work = Join-Path $env:RUNNER_TEMP ("walkie-validation-" + $env:GITHUB_RUN_ID)
          if (Test-Path $work) {
            try { Remove-Item -Recurse -Force $work -ErrorAction Stop } catch { Write-Warning "Could not remove stale validation workspace: $($_.Exception.Message)" }
          }
          New-Item -ItemType Directory -Path $work | Out-Null
          try {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            $zip = Join-Path $work 'rc.zip'
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/zipball/$env:HEAD_SHA" -Headers $headers -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $work
            $repo = Get-ChildItem -Path $work -Directory | Select-Object -First 1
            if (-not $repo) { throw 'Could not extract RC source.' }
            Push-Location $repo.FullName
            try {
              & $npm ci
              if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
              & $npm run typecheck
              if ($LASTEXITCODE -ne 0) { throw 'TypeScript gate failed.' }
              & $npm test -- --runInBand
              if ($LASTEXITCODE -ne 0) { throw 'Jest gate failed.' }
            } finally { Pop-Location }
            'passed=true' | Add-Content $env:GITHUB_OUTPUT
            "TypeScript and Jest passed for exact RC head $env:HEAD_SHA." | Add-Content $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path $work) {
              try { Remove-Item -Recurse -Force $work -ErrorAction Stop } catch {
                Write-Warning "Validation passed/failed independently; workspace cleanup was best-effort and could not remove all files: $($_.Exception.Message)"
                "Cleanup warning: validation workspace contained locked files and could not be fully removed. Gate result is preserved." | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }
          }

  continue:
    name: Dispatch next bounded Agentic unit
    needs: [guard, local-gates]
    if: >-
      always() &&
      needs.guard.outputs.fresh == 'true' &&
      needs.local-gates.result == 'success' &&
      needs.local-gates.outputs.passed == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Agentic RC Worker through GitHub API
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ needs.guard.outputs.target_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $dispatchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/agentic-rc-worker.yml/dispatches"
          $body = @{ ref = 'main'; inputs = @{ target_branch = $env:TARGET_BRANCH } } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri $dispatchUrl -Headers $headers -Method Post -ContentType 'application/json' -Body $body
          "Local gates passed; dispatched next bounded Agentic RC unit for $env:TARGET_BRANCH." | Add-Content $env:GITHUB_STEP_SUMMARY
