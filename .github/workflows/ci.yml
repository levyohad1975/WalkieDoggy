name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Agentic worker OIDC contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/agentic-rc-worker.yml"
          grep -Eq '^[[:space:]]+id-token:[[:space:]]+write[[:space:]]*$' "$workflow"
          if grep -Eq '^[[:space:]]+(pull-requests|issues):[[:space:]]+write[[:space:]]*$' "$workflow"; then
            echo "::error::Agentic worker permissions are broader than the approved contract."
            exit 1
          fi
          [ "$(grep -c -- '--max-turns 60' "$workflow")" -eq 2 ]
          [ "$(grep -c 'continue-on-error: true' "$workflow")" -eq 2 ]
          grep -q 'name: Record validated Claude result' "$workflow"
          grep -q 'name: Enforce validated Claude completion' "$workflow"
          grep -q 'npm run typecheck' "$workflow"
          grep -q 'npm test -- --runInBand' "$workflow"
          grep -q 'AGENTIC_RC_TARGET_BRANCH' "$workflow"
          grep -Eq '^[[:space:]]+PUSH_TOKEN:[[:space:]]+' "$workflow"
          grep -q 'x-access-token:%s' "$workflow"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --runInBand
