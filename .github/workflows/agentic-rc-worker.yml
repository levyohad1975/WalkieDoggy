name: Agentic RC Worker

on:
  workflow_run:
    workflows:
      - CI
      - Batch 2 Supabase Rehearsal
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature branch to continue; leave blank to use the selected workflow branch"
        required: false
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: agentic-rc-worker-${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: Autonomous RC continuation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == (vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2')
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}

    steps:
      - name: Guard autonomous target
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "mode=read" >> "$GITHUB_OUTPUT"
            echo "Manual execution on main is inspection/test-only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          if [[ "$TARGET_BRANCH" == *".."* || "$TARGET_BRANCH" == *"//"* || "$TARGET_BRANCH" == *"@{"* ]]; then
            echo "::error::Unsafe target branch syntax."
            exit 1
          fi
          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;;
            *) echo "::error::Writable target must be an approved non-main feature branch."; exit 1 ;;
          esac
          echo "mode=write" >> "$GITHUB_OUTPUT"
          echo "Validated autonomous feature-branch target: $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: ${{ steps.guard.outputs.mode == 'write' }}

      - name: Detect worker authentication
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then echo "mode=oauth" >> "$GITHUB_OUTPUT"; elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then echo "mode=api" >> "$GITHUB_OUTPUT"; else echo "mode=none" >> "$GITHUB_OUTPUT"; fi

      - name: Record inactive worker state
        if: steps.auth.outputs.mode == 'none'
        shell: bash
        run: |
          echo "No Claude worker credential is configured. The workflow exits safely without mutation." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude worker with OAuth token
        id: claude_oauth
        if: steps.auth.outputs.mode == 'oauth'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          allowed_bots: "github-actions[bot]"
          prompt: |
            Act as the Walkie Doggy Release Candidate autonomous execution worker.
            First read AGENTS.md, EXECUTION_STATE.md, and docs/engineering/AGENTIC_EXECUTION_V1.md before acting.
            Reconstruct state from fresh repository/GitHub evidence.
            Target branch: ${{ env.TARGET_BRANCH }}.
            Locked RC queue: Staging family creation/join E2E; AUTO_APPROVE and System Admin; email/webhook/log; Settings/Roles/Admin QA; Batch 4 regression; real iPhone E2E/RTL/navigation; full CI/Supabase regression; QA Guardian; then RC approval gate.
            Execute exactly one bounded coherent unit from the highest-priority safe task possible. If one path is blocked, select the next independent safe RC task. On a writable RC branch, a successful run must leave durable repository evidence (implementation, tests, or EXECUTION_STATE.md evidence); do not report success with a clean tree while RC work remains.
            For a non-main TARGET_BRANCH you may edit files, run approved tests, create commits, and push only to that same TARGET_BRANCH. Do not edit .github/workflows/**. For main you are inspection/test-only.
            Never merge, direct-push main, deploy to Production, run Production migrations, modify Production data/RLS/secrets/credentials, perform destructive actions, purchases/charges, or public publishing. Do not expose secrets. No evidence = not completed.
            End with: Current Task, Status, Fresh Evidence, Blocker, Next Safe Task, Owner Approval Required, Action Taken.
          claude_args: |
            --max-turns 60
            --allowedTools "${{ steps.guard.outputs.mode == 'write' && 'Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' || 'Read,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' }}"

      - name: Detect transient OAuth startup failure
        id: oauth_transient
        if: always() && steps.auth.outputs.mode == 'oauth' && steps.claude_oauth.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "retry=false" >> "$GITHUB_OUTPUT"
          result_file="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$result_file" ]; then exit 0; fi
          if grep -Eq '"subtype"[[:space:]]*:[[:space:]]*"success"' "$result_file" && grep -Eq '"is_error"[[:space:]]*:[[:space:]]*true' "$result_file" && grep -Eq '"num_turns"[[:space:]]*:[[:space:]]*[01]([,}])' "$result_file"; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Detected a transient Claude startup failure before meaningful model execution; allowing one bounded retry." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retry Claude worker once after transient OAuth startup failure
        id: claude_oauth_retry
        if: steps.oauth_transient.outputs.retry == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          allowed_bots: "github-actions[bot]"
          prompt: |
            Retry the Walkie Doggy Release Candidate autonomous execution worker after a transient startup failure. Read AGENTS.md, EXECUTION_STATE.md, and docs/engineering/AGENTIC_EXECUTION_V1.md. Target branch: ${{ env.TARGET_BRANCH }}. Execute one bounded safe RC unit. On a writable RC branch, leave durable repository evidence; a clean-tree success while work remains is invalid. Preserve all safety gates: never merge, direct-push main, touch Production/data/migrations/secrets, purchase, publish publicly, or perform destructive actions. Do not edit .github/workflows/**. No evidence = not completed.
          claude_args: |
            --max-turns 60
            --allowedTools "${{ steps.guard.outputs.mode == 'write' && 'Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' || 'Read,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' }}"

      - name: Run Claude worker with Anthropic API key
        id: claude_api
        if: steps.auth.outputs.mode == 'api'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          allowed_bots: "github-actions[bot]"
          prompt: |
            Act as the Walkie Doggy Release Candidate autonomous execution worker. Read AGENTS.md, EXECUTION_STATE.md, and docs/engineering/AGENTIC_EXECUTION_V1.md. Target branch: ${{ env.TARGET_BRANCH }}. Execute one bounded safe RC unit. On a writable RC branch, leave durable repository evidence; a clean-tree success while work remains is invalid. Do not edit .github/workflows/**. Never merge, direct-push main, touch Production/data/migrations/secrets, purchase, publish publicly, or perform destructive actions. No evidence = not completed.
          claude_args: |
            --max-turns 60
            --allowedTools "${{ steps.guard.outputs.mode == 'write' && 'Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' || 'Read,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' }}"

      - name: Classify Claude result
        id: claude_result
        if: always() && steps.auth.outputs.mode != 'none'
        shell: bash
        env:
          OAUTH_OUTCOME: ${{ steps.claude_oauth.outcome }}
          OAUTH_RETRY_OUTCOME: ${{ steps.claude_oauth_retry.outcome }}
          API_OUTCOME: ${{ steps.claude_api.outcome }}
        run: |
          set -euo pipefail
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "checkpoint_eligible=false" >> "$GITHUB_OUTPUT"
          if [ "$OAUTH_OUTCOME" = "success" ] || [ "$OAUTH_RETRY_OUTCOME" = "success" ] || [ "$API_OUTCOME" = "success" ]; then echo "success=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          result_file="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$result_file" ] && grep -Eq '"subtype"[[:space:]]*:[[:space:]]*"success"' "$result_file" && grep -Eq '"is_error"[[:space:]]*:[[:space:]]*false' "$result_file"; then echo "success=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f "$result_file" ] && grep -Eq '"subtype"[[:space:]]*:[[:space:]]*"error_max_turns"' "$result_file"; then echo "checkpoint_eligible=true" >> "$GITHUB_OUTPUT"; fi

      - name: Validate and publish feature-branch progress
        id: publish
        if: >-
          always() &&
          steps.guard.outputs.mode == 'write' &&
          steps.auth.outputs.mode != 'none' &&
          (steps.claude_result.outputs.success == 'true' || steps.claude_result.outputs.checkpoint_eligible == 'true')
        shell: bash
        env:
          SAFE_TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}
          PUSH_TOKEN: ${{ github.token }}
          CLAUDE_SUCCESS: ${{ steps.claude_result.outputs.success }}
          CHECKPOINT_ELIGIBLE: ${{ steps.claude_result.outputs.checkpoint_eligible }}
        run: |
          set -euo pipefail
          echo "published=false" >> "$GITHUB_OUTPUT"
          case "$SAFE_TARGET_BRANCH" in feat/*|fix/*|chore/*|test/*|docs/*|rc/*) ;; *) echo "::error::Refusing to publish to an unapproved branch."; exit 1 ;; esac
          current_branch="$(git branch --show-current)"
          if [ "$current_branch" != "$SAFE_TARGET_BRANCH" ]; then echo "::error::Current branch does not match the validated target."; exit 1; fi
          workflow_changes="$(git status --porcelain -- .github/workflows || true)"
          if [ -n "$workflow_changes" ]; then
            echo "Autonomous workflow edits were discarded and require a separate infrastructure PR." >> "$GITHUB_STEP_SUMMARY"
            git restore --staged --worktree -- .github/workflows || true
            git clean -fd -- .github/workflows
          fi
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            if [ "$CLAUDE_SUCCESS" = "true" ]; then
              echo "::error::NO_PROGRESS: Claude completed successfully but produced no durable repository evidence on writable RC branch $SAFE_TARGET_BRANCH."
              exit 1
            fi
            echo "::error::Claude reached the turn limit without repository changes to checkpoint."
            exit 1
          fi
          npm ci
          npm run typecheck
          npm test -- --runInBand
          git diff --check
          git config user.name "walkie-agentic-worker[bot]"
          git config user.email "walkie-agentic-worker[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if [ "$CHECKPOINT_ELIGIBLE" = "true" ] && [ "$CLAUDE_SUCCESS" != "true" ]; then commit_message="chore(agentic): checkpoint RC execution"; else commit_message="chore(agentic): continue RC execution"; fi
          git commit -m "$commit_message"
          push_auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $push_auth" push origin "HEAD:refs/heads/$SAFE_TARGET_BRANCH"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Enforce validated Claude completion or checkpoint
        if: >-
          always() &&
          steps.auth.outputs.mode != 'none' &&
          steps.claude_result.outputs.success != 'true' &&
          steps.publish.outputs.published != 'true'
        shell: bash
        run: |
          echo "::error::Claude did not complete successfully and no fully validated checkpoint was published."
          exit 1
