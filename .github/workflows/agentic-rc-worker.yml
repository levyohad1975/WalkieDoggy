name: Agentic RC Worker

on:
  workflow_run:
    workflows:
      - CI
      - Batch 2 Supabase Rehearsal
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Feature branch to continue; leave blank to use the selected workflow branch"
        required: false
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: agentic-rc-worker-${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    name: Autonomous RC continuation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}

    steps:
      - name: Guard autonomous target
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "mode=read" >> "$GITHUB_OUTPUT"
            echo "Manual execution on main is inspection/test-only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          if [[ "$TARGET_BRANCH" == *".."* || "$TARGET_BRANCH" == *"//"* || "$TARGET_BRANCH" == *"@{"* ]]; then
            echo "::error::Unsafe target branch syntax."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*)
              ;;
            *)
              echo "::error::Writable target must be an approved non-main feature branch."
              exit 1
              ;;
          esac

          echo "mode=write" >> "$GITHUB_OUTPUT"
          echo "Validated autonomous feature-branch target: $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: ${{ steps.guard.outputs.mode == 'write' }}

      - name: Detect worker authentication
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "mode=api" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Record inactive worker state
        if: steps.auth.outputs.mode == 'none'
        shell: bash
        run: |
          {
            echo "## Agentic RC Worker"
            echo
            echo "No Claude worker credential is configured."
            echo "The workflow exits safely without mutation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude worker with OAuth token
        id: claude_oauth
        if: steps.auth.outputs.mode == 'oauth'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Act as the Walkie Doggy Release Candidate autonomous execution worker.

            First read AGENTS.md, EXECUTION_STATE.md, and
            docs/engineering/AGENTIC_EXECUTION_V1.md before acting.
            Reconstruct state from fresh repository/GitHub evidence.

            Trigger context:
            - event: ${{ github.event_name }}
            - upstream workflow: ${{ github.event.workflow_run.name || 'manual-dispatch' }}
            - upstream run id: ${{ github.event.workflow_run.id || 'n/a' }}
            - upstream conclusion: ${{ github.event.workflow_run.conclusion || 'manual' }}
            - target branch: ${{ env.TARGET_BRANCH }}
            - target sha: ${{ github.event.workflow_run.head_sha || github.sha }}

            Locked RC queue:
            1. Staging family-creation E2E through persisted family, invite/join code/link/QR and second-member join.
            2. AUTO_APPROVE_NEW_FAMILIES true/false plus System Admin approve/reject.
            3. Welcome/system-owner email, Resend webhook and email_delivery_log.
            4. Settings/Roles/System Admin QA and release-blocking fixes.
            5. Batch 4 regression.
            6. Real iPhone E2E/RTL/navigation/family flows.
            7. Full CI and Supabase regression.
            8. QA Guardian.
            Then stop at the Release Candidate approval gate.

            Execute the highest-priority safe task possible from this environment.
            If an upstream run failed, inspect the failure and attempt the smallest safe repository-side fix permitted by AGENTS.md.
            If it passed, advance to the next executable safe RC task instead of only reporting.

            For a non-main TARGET_BRANCH you may edit files, run approved tests, create commits, and push only to that same TARGET_BRANCH.
            For TARGET_BRANCH=main you are inspection/test-only: do not edit, commit, or push repository changes.
            Never create, update, or merge a PR unless the repository governance explicitly permits that action; never merge under any circumstance.
            Never direct-push main. Never deploy to Production.
            Never run Production migrations or modify Production data/RLS/secrets/credentials.
            Never perform destructive/irreversible actions, purchases/charges, or public publishing.
            Do not expose or print secrets.
            No evidence = not completed.
            If one path is blocked, select the next independent safe RC task.

            End with: Current Task, Status, Fresh Evidence, Blocker,
            Next Safe Task, Owner Approval Required, Action Taken.
          claude_args: |
            --max-turns 60
            --allowedTools "${{ steps.guard.outputs.mode == 'write' && 'Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' || 'Read,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' }}"

      - name: Run Claude worker with Anthropic API key
        id: claude_api
        if: steps.auth.outputs.mode == 'api'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            Act as the Walkie Doggy Release Candidate autonomous execution worker.
            Read AGENTS.md, EXECUTION_STATE.md, and docs/engineering/AGENTIC_EXECUTION_V1.md first.
            Reconstruct state from fresh repository/GitHub evidence and execute the highest-priority safe RC task permitted by those rules.
            Target branch is ${{ env.TARGET_BRANCH }}.
            On a non-main target you may edit, test, commit, and push only to that same target branch. On main you are inspection/test-only.
            Never merge, direct-push main, deploy to Production, run Production migrations, modify Production data/RLS/secrets/credentials, expose secrets, perform destructive actions, purchases/charges, or public publishing.
            No evidence = not completed.
            End with: Current Task, Status, Fresh Evidence, Blocker, Next Safe Task, Owner Approval Required, Action Taken.
          claude_args: |
            --max-turns 60
            --allowedTools "${{ steps.guard.outputs.mode == 'write' && 'Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' || 'Read,Glob,Grep,Bash(npm ci),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npm test -- --runInBand),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git ls-files:*),Bash(ls:*),Bash(pwd),Bash(npm test:*),Bash(npx jest:*)' }}"


      - name: Record validated Claude result
        id: claude_result
        if: always() && steps.auth.outputs.mode != 'none'
        shell: bash
        env:
          OAUTH_OUTCOME: ${{ steps.claude_oauth.outcome }}
          API_OUTCOME: ${{ steps.claude_api.outcome }}
        run: |
          set -euo pipefail
          if [ "$OAUTH_OUTCOME" = "success" ] || [ "$API_OUTCOME" = "success" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result_file="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$result_file" ] &&
             grep -Eq '"subtype"[[:space:]]*:[[:space:]]*"success"' "$result_file" &&
             grep -Eq '"is_error"[[:space:]]*:[[:space:]]*false' "$result_file"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "Claude returned a successful result despite the action wrapper outcome." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Commit and push validated feature-branch changes
        if: always() && steps.guard.outputs.mode == 'write' && steps.auth.outputs.mode != 'none' && steps.claude_result.outputs.success == 'true'
        shell: bash
        env:
          SAFE_TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.target_branch || github.ref_name }}
        run: |
          set -euo pipefail

          case "$SAFE_TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*)
              ;;
            *)
              echo "::error::Refusing to publish to an unapproved branch."
              exit 1
              ;;
          esac

          current_branch="$(git branch --show-current)"
          if [ "$current_branch" != "$SAFE_TARGET_BRANCH" ]; then
            echo "::error::Current branch does not match the validated target."
            exit 1
          fi

          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "Worker completed without repository changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm run typecheck
          npm test -- --runInBand
          git diff --check
            echo "Worker completed without repository changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "walkie-agentic-worker[bot]"
          git config user.email "walkie-agentic-worker[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(agentic): continue RC execution"
          git push origin "HEAD:refs/heads/$SAFE_TARGET_BRANCH"
          echo "Published a validated commit to $SAFE_TARGET_BRANCH." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce validated Claude completion
        if: always() && steps.auth.outputs.mode != 'none' && steps.claude_result.outputs.success != 'true'
        shell: bash
        run: |
          echo "::error::Claude did not produce a validated successful result."
          exit 1
