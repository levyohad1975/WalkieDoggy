name: Agentic Staging Continuation

on:
  workflow_run:
    workflows:
      - Staging OTP E2E
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: agentic-staging-continuation
  cancel-in-progress: false

jobs:
  continue-rc:
    name: Continue RC after Staging evidence
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ vars.AGENTIC_RC_TARGET_BRANCH || 'feat/verified-auth-onboarding-batch-2' }}

    steps:
      - name: Guard approved RC target
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "::error::Refusing to dispatch the autonomous worker against main."
            exit 1
          fi

          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          if [[ "$TARGET_BRANCH" == *".."* || "$TARGET_BRANCH" == *"//"* || "$TARGET_BRANCH" == *"@{"* ]]; then
            echo "::error::Unsafe target branch syntax."
            exit 1
          fi

          case "$TARGET_BRANCH" in
            feat/*|fix/*|chore/*|test/*|docs/*|rc/*)
              ;;
            *)
              echo "::error::Target must be an approved non-main RC branch."
              exit 1
              ;;
          esac

          echo "Validated post-Staging RC continuation target: $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Agentic RC Worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(jq -cn \
            --arg ref "main" \
            --arg target "$TARGET_BRANCH" \
            '{ref:$ref, inputs:{target_branch:$target}}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/agentic-rc-worker.yml/dispatches" \
            --data "$payload"

          {
            echo "## Agentic Staging Continuation"
            echo
            echo "Successful Staging OTP E2E evidence dispatched the Agentic RC Worker."
            echo "Target branch: \`$TARGET_BRANCH\`"
            echo "Upstream run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}"
          } >> "$GITHUB_STEP_SUMMARY"
