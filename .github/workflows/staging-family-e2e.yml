name: Staging Family E2E

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Non-main RC branch associated with this Staging validation'
        required: true
        default: 'feat/verified-auth-onboarding-batch-2'

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ inputs.target_branch }}
  EXPECTED_STAGING_PROJECT_REF: czbxhsoxyawprqehkfit

jobs:
  staging-family-e2e:
    name: Real Staging Family E2E
    runs-on: [self-hosted, Windows, X64]
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Guard staging-only target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET_BRANCH -eq 'main') {
            throw 'Refusing to associate live Staging family E2E with main.'
          }
          git check-ref-format --branch $env:TARGET_BRANCH | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Invalid target branch name.' }
          if ($env:TARGET_BRANCH -notmatch '^(feat|fix|chore|test|docs|rc)/') {
            throw 'Target must be an approved non-main RC branch.'
          }

      - name: Checkout trusted executor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Windows prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is unavailable.' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node is unavailable.' }
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is unavailable.' }

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Verify required Staging secrets are present
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'SUPABASE_STAGING_URL',
            'SUPABASE_STAGING_ANON_KEY',
            'STAGING_OTP_TEST_EMAIL',
            'STAGING_OTP_GMAIL_CLIENT_ID',
            'STAGING_OTP_GMAIL_CLIENT_SECRET',
            'STAGING_OTP_GMAIL_REFRESH_TOKEN'
          )
          $missing = @()
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Missing required staging secret(s): $($missing -join ', ')"
          }

      - name: Guard exact Staging project
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:SUPABASE_STAGING_URL
          $projectRef = $uri.Host.Split('.')[0]
          if ($projectRef -ne $env:EXPECTED_STAGING_PROJECT_REF) {
            throw 'Refusing Family E2E outside the approved Staging project.'
          }
          Write-Host 'Verified approved Staging project target.'

      - name: Run verified family creation E2E against Staging
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          node scripts/staging-family-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Staging Family E2E exited with code $LASTEXITCODE." }

      - name: Write evidence summary
        if: always()
        shell: powershell
        run: |
          @"
          ## Staging Family E2E

          - Associated RC branch: ``$env:TARGET_BRANCH``
          - Environment: ``staging``
          - Runner: ``self-hosted Windows X64``
          - Shell: ``Windows PowerShell``
          - Flow: OTP → verified session → family persistence → invite lookup → second-device join when active
          - Auth configuration mutation: none
          - Service-role credential used: no
          - Production credentials used: no
          - Production deploy/migration performed: no
          - Result: ``${{ job.status }}``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
