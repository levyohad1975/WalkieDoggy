name: Staging Family E2E

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Non-main RC branch associated with this Staging validation'
        required: true
        default: 'feat/verified-auth-onboarding-batch-2'

permissions:
  contents: read

env:
  TARGET_BRANCH: ${{ inputs.target_branch }}
  EXPECTED_STAGING_PROJECT_REF: czbxhsoxyawprqehkfit

jobs:
  staging-family-e2e:
    name: Real Staging Family E2E
    runs-on: [self-hosted, Windows, X64]
    environment: staging
    timeout-minutes: 25

    steps:
      - name: Guard staging-only target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET_BRANCH -eq 'main') { throw 'Refusing to associate live Staging family E2E with main.' }
          git check-ref-format --branch $env:TARGET_BRANCH | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Invalid target branch name.' }
          if ($env:TARGET_BRANCH -notmatch '^(feat|fix|chore|test|docs|rc)/') { throw 'Target must be an approved non-main RC branch.' }

      - name: Checkout trusted executor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Windows prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Git is unavailable.' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node is unavailable.' }
          npm --version
          if ($LASTEXITCODE -ne 0) { throw 'npm is unavailable.' }

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Verify required Staging secrets are present
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('SUPABASE_STAGING_URL','SUPABASE_STAGING_ANON_KEY','STAGING_OTP_TEST_EMAIL','STAGING_OTP_GMAIL_CLIENT_ID','STAGING_OTP_GMAIL_CLIENT_SECRET','STAGING_OTP_GMAIL_REFRESH_TOKEN')
          $missing = @()
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing required staging secret(s): $($missing -join ', ')" }

      - name: Guard exact Staging project
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:SUPABASE_STAGING_URL
          $projectRef = $uri.Host.Split('.')[0]
          if ($projectRef -ne $env:EXPECTED_STAGING_PROJECT_REF) { throw 'Refusing Family E2E outside the approved Staging project.' }
          Write-Host 'Verified approved Staging project target.'

      - name: Diagnose Staging network connectivity
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $uri = [Uri]$env:SUPABASE_STAGING_URL
          $hostName = $uri.Host
          Write-Host "Connectivity diagnostics for approved Staging host: $hostName"
          try {
            $addresses = [System.Net.Dns]::GetHostAddresses($hostName)
            Write-Host "DNS resolved: $($addresses.Count) address(es)."
          } catch {
            Write-Host "DNS resolution failed: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }
          try {
            $tcp = New-Object System.Net.Sockets.TcpClient
            $async = $tcp.BeginConnect($hostName, 443, $null, $null)
            if (-not $async.AsyncWaitHandle.WaitOne(10000, $false)) { throw 'TCP 443 connection timed out.' }
            $tcp.EndConnect($async)
            Write-Host 'TCP 443 connection succeeded.'
            $tcp.Close()
          } catch {
            Write-Host "TCP 443 failed: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }
          try {
            $request = [System.Net.HttpWebRequest]::Create($env:SUPABASE_STAGING_URL + '/auth/v1/health')
            $request.Method = 'GET'
            $request.Timeout = 15000
            $request.AllowAutoRedirect = $false
            $response = $request.GetResponse()
            Write-Host "HTTPS health request succeeded: HTTP $([int]$response.StatusCode)."
            $response.Close()
          } catch [System.Net.WebException] {
            if ($_.Exception.Response) {
              Write-Host "HTTPS endpoint was reachable and returned HTTP $([int]$_.Exception.Response.StatusCode)."
              $_.Exception.Response.Close()
            } else {
              Write-Host "HTTPS request failed before HTTP response: $($_.Exception.Status): $($_.Exception.Message)"
              if ($_.Exception.InnerException) { Write-Host "HTTPS inner error: $($_.Exception.InnerException.GetType().FullName): $($_.Exception.InnerException.Message)" }
            }
          }
          Write-Host "Service account: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Write-Host "System proxy: $([System.Net.WebRequest]::DefaultWebProxy.GetProxy($uri))"

      - name: Diagnose Node HTTPS connectivity
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
        run: |
          $ErrorActionPreference = 'Continue'
          @'
          const url = process.env.SUPABASE_STAGING_URL;
          try {
            const res = await fetch(`${url}/auth/v1/health`, { signal: AbortSignal.timeout(15000) });
            console.log(`Node fetch reached Staging: HTTP ${res.status}`);
          } catch (error) {
            console.log(`Node fetch failed: ${error?.name}: ${error?.message}`);
            if (error?.cause) {
              console.log(`Node cause: ${error.cause?.constructor?.name}: ${error.cause?.message}`);
              if (error.cause?.code) console.log(`Node cause code: ${error.cause.code}`);
              if (error.cause?.errno) console.log(`Node cause errno: ${error.cause.errno}`);
              if (error.cause?.syscall) console.log(`Node cause syscall: ${error.cause.syscall}`);
            }
          }
          '@ | node --input-type=module

      - name: Run verified family creation E2E against Staging
        shell: powershell
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          STAGING_OTP_TEST_EMAIL: ${{ secrets.STAGING_OTP_TEST_EMAIL }}
          STAGING_OTP_GMAIL_CLIENT_ID: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_ID }}
          STAGING_OTP_GMAIL_CLIENT_SECRET: ${{ secrets.STAGING_OTP_GMAIL_CLIENT_SECRET }}
          STAGING_OTP_GMAIL_REFRESH_TOKEN: ${{ secrets.STAGING_OTP_GMAIL_REFRESH_TOKEN }}
        run: |
          node scripts/staging-family-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "Staging Family E2E exited with code $LASTEXITCODE." }

      - name: Write evidence summary
        if: always()
        shell: powershell
        run: |
          @"
          ## Staging Family E2E

          - Associated RC branch: ``$env:TARGET_BRANCH``
          - Environment: ``staging``
          - Runner: ``self-hosted Windows X64``
          - Shell: ``Windows PowerShell``
          - Connectivity diagnostics: DNS + TCP 443 + Windows HTTPS + Node fetch
          - Flow: OTP → verified session → family persistence → invite lookup → second-device join when active
          - Auth configuration mutation: none
          - Service-role credential used: no
          - Production credentials used: no
          - Production deploy/migration performed: no
          - Result: ``${{ job.status }}``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
