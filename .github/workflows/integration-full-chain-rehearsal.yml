name: Integration Full-Chain Supabase Rehearsal

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to rehearse (defaults to the branch this is dispatched from)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  full-chain-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref }}

      - name: Verify known duplicate 0019 state
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/0019_request_result_read_state.sql
          test -f supabase/migrations/0019_request_result_seen_state.sql
          test ! -s supabase/migrations/0019_request_result_read_state.sql
          test -s supabase/migrations/0019_request_result_seen_state.sql

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Seed schema.sql as migration 0000 (matches every historical migration's own stated precondition)
        # Migration 0001's own header: "Safe to run against an existing
        # database seeded from supabase/schema.sql ... Run this ... AFTER
        # the base schema exists." schema.sql is the true pre-migration-1
        # bootstrap baseline, not a periodically-refreshed snapshot of
        # "state as of migration N" -- every one of 0001-0048 (including
        # 0043-0048) must run on top of it in full, real order. This copies
        # the repository file into the migrations directory (never
        # modifying or committing supabase/schema.sql itself) so
        # `supabase db reset --local`'s normal lexicographic replay picks
        # it up first, then every real migration file runs unmodified
        # after it -- the same "prepend as 0000" trick the Batch 2
        # rehearsal used, but keeping the FULL chain (0001-0048) instead
        # of hand-picking a subset.
        run: cp supabase/schema.sql supabase/migrations/0000_base_schema.sql

      - name: Start isolated Supabase stack
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor

      - name: Replay the FULL real migration chain (0000 base + 0001-current) from empty
        run: supabase db reset --local

      - name: Run the 0043-0048 integration rehearsal (real Postgres, not source review)
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/manual_tests/0043_0048_integration_rehearsal_acl.sql

      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
