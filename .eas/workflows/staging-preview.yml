# Deploys only a preview alias; production is never promoted by this workflow.
name: Deploy web staging

on:
  push:
    branches:
      - feat/home-dog-photo-mascot

jobs:
  deploy_web_staging:
    name: Deploy web staging
    type: deploy
    environment: preview
    env:
      # Client-side staging config is intentionally public and is already embedded in the Vercel web bundle.
      # Pin it here so EAS Hosting exports the same backend config even when the EAS preview env is empty.
      EXPO_PUBLIC_SUPABASE_URL: https://czbxhsoxyawprqehkfit.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_eqvarDUtnu4WM3Oy8fXKsQ_2BrsPRwa
    params:
      alias: staging
