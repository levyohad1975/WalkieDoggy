project_id = "walkie-doggy-rehearsal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:19006"
additional_redirect_urls = ["http://127.0.0.1:19006/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.email-provider-webhook]
# Resend's delivery-event webhook never carries a Supabase-issued JWT; this
# function verifies Resend's own Svix-style signature itself (see its
# source). verify_jwt stays the default (true) for every function not
# listed in this file.
verify_jwt = false

[functions.send-email]
# Supabase Auth calls this Send Email Hook server-to-server with a Standard
# Webhooks signature (SEND_EMAIL_HOOK_SECRET), never a Supabase-issued JWT --
# there is no end-user session at hook-call time. This function verifies
# that signature itself (see its source).
verify_jwt = false

[functions.send-walk-reminders]
# P0 notification-delivery fix: this function's only legitimate caller is
# this project's own pg_cron -> pg_net trigger, which carries no
# Supabase-issued JWT at all -- only a custom `x-cron-secret` header the
# function verifies itself against WALK_REMINDER_CRON_SECRET (see its
# source's own header comment). Without this declaration, the platform
# gateway's default verify_jwt=true rejects that call with 401 before the
# function's own code -- and thus its secret check -- ever runs, which was
# previously only ever handled by remembering to pass `--no-verify-jwt` on
# each manual `supabase functions deploy` call: a flag with no durable,
# version-controlled record, silently lost on any redeploy that omits it
# (for example, deploying the reminderMessages.ts wording fix from this
# same investigation). Declaring it here, like the two functions above,
# makes it durable instead of dependent on remembering a CLI flag.
verify_jwt = false
